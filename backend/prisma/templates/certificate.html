<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate of Achievement</title>
    <style>
        body { font-family: 'Times New Roman', serif; margin: 0; padding: 0; background: #f8fafc; display: flex; justify-content: center; padding: 20px;}
        .certificate {
            width: 800px;
            height: 600px;
            background: white;
            border: 15px solid #1e3a8a;
            position: relative;
            padding: 40px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .inner-border {
            border: 2px solid #3b82f6;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header h1 { font-family: 'Tangerine', cursive; font-size: 56px; color: #1e3a8a; margin: 0; }
        .header h3 { font-size: 24px; color: #475569; margin: 10px 0; font-weight: normal; text-transform: uppercase; letter-spacing: 2px; }
        .content { margin: 30px 0; }
        .presented-to { font-size: 18px; color: #64748b; font-style: italic; }
        .student-name { font-size: 42px; font-weight: bold; color: #0f172a; margin: 15px 0; border-bottom: 2px solid #cbd5e1; display: inline-block; padding: 0 40px 5px; }
        .description { font-size: 20px; color: #334155; line-height: 1.6; max-width: 600px; margin: 20px auto 0; }
        .footer { display: flex; justify-content: space-between; margin-top: 50px; padding: 0 40px; }
        .signature-block { width: 200px; text-align: center; }
        .signature-line { border-top: 1px solid #0f172a; margin-top: 40px; pt-2; }
        .signature-name { font-size: 16px; font-weight: bold; margin: 10px 0 0; }
        .signature-title { font-size: 14px; color: #64748b; margin: 0; }
    </style>
</head>
<body>
    <div class="certificate">
        <div class="inner-border">
            <div class="header">
                <h1>Certificate of Achievement</h1>
                <h3>{{institution.name}}</h3>
            </div>
            
            <div class="content">
                <p class="presented-to">This certificate is proudly presented to</p>
                <h2 class="student-name">{{student.name}}</h2>
                <p class="description">
                    In recognition of outstanding academic performance and dedication during the {{certificate.academicYear}} academic year.
                </p>
            </div>
            
            <div class="footer">
                <div class="signature-block">
                    <div class="signature-line"></div>
                    <p class="signature-name">Date</p>
                    <p class="signature-title">{{certificate.issueDate}}</p>
                </div>
                <div class="signature-block">
                    <div class="signature-line"></div>
                    <p class="signature-name">Principal</p>
                    <p class="signature-title">{{institution.name}}</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
