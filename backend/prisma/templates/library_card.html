<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Member Card</title>
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 20px; background: #f0f2f5; }
        .lib-card {
            width: 3.375in;
            height: 2.125in;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
        }
        .header {
            background: #0f172a;
            color: white;
            text-align: left;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .school-name { font-size: 11px; font-weight: bold; margin: 0; text-transform: uppercase; }
        .card-title { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
        
        .content {
            flex: 1;
            display: flex;
            padding: 10px 15px;
            gap: 15px;
        }
        .photo-container {
            width: 60px;
            height: 70px;
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
        }
        .photo { width: 100%; height: 100%; object-fit: cover; }
        
        .details { flex: 1; }
        .student-name { font-size: 14px; font-weight: bold; margin: 0 0 5px; color: #0f172a; }
        .info-row { display: flex; font-size: 10px; margin-bottom: 3px; color: #334155; }
        .info-label { width: 60px; font-weight: 600; color: #64748b; }
        .info-value { font-weight: 500; }
        
        .footer {
            background: #f8fafc;
            padding: 8px 15px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .barcode { font-family: 'Libre Barcode 39 Text', monospace; font-size: 24px; color: #0f172a; margin: 0; letter-spacing: 1px; }
        .validity { font-size: 9px; color: #64748b; text-align: right; }
    </style>
</head>
<body>
    <div class="lib-card">
        <div class="header">
            <div class="school-name">{{institution.name}}</div>
            <div class="card-title">Library Card</div>
        </div>
        <div class="content">
            <div class="photo-container">
                <img class="photo" src="{{student.profilePictureUrl}}" alt="Student Photo">
            </div>
            <div class="details">
                <p class="student-name">{{student.name}}</p>
                <div class="info-row">
                    <span class="info-label">Member ID:</span> 
                    <span class="info-value">{{libraryCard.cardNumber}}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Class:</span> 
                    <span class="info-value">{{student.section.class.name}} {{student.section.name}}</span>
                </div>
                <div class="info-row" style="margin-top: 5px;">
                    <span class="info-label">Blood Grp:</span> 
                    <span class="info-value">{{student.bloodGroup}}</span>
                </div>
            </div>
        </div>
        <div class="footer">
            <!-- Simulated barcode text representation -->
            <p class="barcode">*{{libraryCard.cardNumber}}*</p>
            <div class="validity">
                <strong>Valid Till</strong><br>
                {{libraryCard.validUntil}}
            </div>
        </div>
    </div>
</body>
</html>
